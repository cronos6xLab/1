<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Radio Explorer - Mapa de coberturas</title>
  <!-- Leaflet CSS y JS (cargado de forma segura) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* RESET Y ESTILOS COMPLETOS (aseguran que el mapa ocupe toda la pantalla) */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0a0c10;
      --panel: #111318;
      --border: #1e2128;
      --accent: #00e5a0;
      --accent2: #0099ff;
      --text: #f0f2f5;
      --muted: #6b7280;
      --card-bg: #161920;
    }

    html, body {
      height: 100%;
      width: 100%;
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    .app {
      display: grid;
      grid-template-columns: 380px 1fr;
      height: 100vh;
      width: 100%;
    }

    /* Sidebar */
    .sidebar {
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      z-index: 10;
    }

    .header {
      padding: 22px 22px 18px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }

    .logo-text {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 19px;
      letter-spacing: -0.5px;
    }

    .logo-text span {
      color: var(--accent);
    }

    .tagline {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.4px;
    }

    .add-form {
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .section-title {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap .icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      pointer-events: none;
      opacity: 0.7;
    }

    input, select {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      padding: 10px 12px 10px 34px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 229, 160, 0.07);
    }

    .row-controls {
      display: grid;
      grid-template-columns: 1fr 80px;
      gap: 8px;
    }

    .swatch-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .color-swatch {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.13s, border-color 0.13s;
    }

    .color-swatch.active {
      border-color: white;
    }

    .status {
      font-size: 11px;
      padding: 8px 12px;
      border-radius: 8px;
      display: none;
      align-items: center;
      gap: 7px;
    }

    .status.loading {
      display: flex;
      background: rgba(0, 153, 255, 0.08);
      color: var(--accent2);
    }

    .status.error {
      display: flex;
      background: rgba(255, 80, 80, 0.08);
      color: #ff7070;
    }

    .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid rgba(0, 153, 255, 0.3);
      border-top-color: var(--accent2);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .btn-add {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #0a0c10;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 13px;
      border: none;
      border-radius: 10px;
      padding: 11px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-add:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .locations-header {
      padding: 12px 22px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .locations-count {
      font-family: 'Syne', sans-serif;
      font-size: 11px;
      font-weight: 700;
      background: rgba(0, 229, 160, 0.12);
      color: var(--accent);
      border-radius: 20px;
      padding: 2px 9px;
      margin-left: 6px;
    }

    .btn-clear-all {
      font-size: 11px;
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .btn-clear-all:hover {
      color: #ff7070;
    }

    .locations-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 22px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 40px 0;
      color: var(--muted);
      text-align: center;
    }

    .loc-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .loc-card-header {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 12px;
      cursor: pointer;
    }

    .loc-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .loc-name {
      font-size: 12px;
      font-weight: 500;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .loc-badge {
      font-size: 10px;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 20px;
    }

    .loc-actions {
      display: flex;
      gap: 3px;
    }

    .loc-btn {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      background: transparent;
      color: var(--muted);
    }

    .loc-btn.delete:hover {
      background: rgba(255, 80, 80, 0.12);
      color: #ff7070;
    }

    .loc-btn.focus-btn:hover {
      background: rgba(0, 229, 160, 0.1);
      color: var(--accent);
    }

    .loc-body {
      padding: 0 12px 10px;
      display: none;
      border-top: 1px solid var(--border);
      margin-top: 2px;
      padding-top: 10px;
    }

    .loc-body.open {
      display: block;
    }

    .loc-edit-row {
      display: grid;
      grid-template-columns: 1fr 70px;
      gap: 6px;
      margin-bottom: 10px;
    }

    .loc-color-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .loc-swatch {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      cursor: pointer;
      border: 2px solid transparent;
    }

    .loc-swatch.active {
      border-color: white;
    }

    .sidebar-footer {
      padding: 10px 22px;
      border-top: 1px solid var(--border);
      font-size: 10px;
      color: var(--muted);
      text-align: center;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #0d0f14;
    }

    .btn-fit {
      position: absolute;
      bottom: 22px;
      right: 22px;
      z-index: 800;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      font-size: 12px;
      font-weight: 600;
      padding: 9px 15px;
      border-radius: 28px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    }

    .btn-fit:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    @media (max-width: 700px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
      }
      .sidebar {
        max-height: 58vh;
        overflow-y: auto;
      }
      html, body {
        overflow: auto;
      }
    }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="header">
      <div class="logo">
        <div class="logo-icon">📍</div>
        <div class="logo-text">Radio<span>Explorer</span></div>
      </div>
      <div class="tagline">Visualiza múltiples radios en el mapa a la vez</div>
    </div>

    <div class="add-form">
      <div class="section-title">➕ Agregar ubicación</div>
      <div class="field-group">
        <div class="input-wrap">
          <span class="icon">🔍</span>
          <input type="text" id="locationInput" placeholder="Dirección, ciudad, lugar…" autocomplete="off" />
          <div class="suggestions-box" id="suggestions"></div>
        </div>
      </div>
      <div class="row-controls">
        <div class="input-wrap">
          <span class="icon">📐</span>
          <select id="unitSelect">
            <option value="km">Kilómetros</option>
            <option value="mi">Millas</option>
            <option value="m">Metros</option>
          </select>
        </div>
        <div class="input-wrap">
          <span class="icon" style="font-size:10px; left:9px;">⭕</span>
          <input type="number" id="radiusInput" value="1.5" min="0.05" step="0.2" />
        </div>
      </div>
      <div>
        <div class="section-title">🎨 Color</div>
        <div class="swatch-row" id="colorPicker">
          <div class="color-swatch active" data-color="#00e5a0" style="background:#00e5a0;"></div>
          <div class="color-swatch" data-color="#0099ff" style="background:#0099ff;"></div>
          <div class="color-swatch" data-color="#ff4d6d" style="background:#ff4d6d;"></div>
          <div class="color-swatch" data-color="#ffd166" style="background:#ffd166;"></div>
          <div class="color-swatch" data-color="#c77dff" style="background:#c77dff;"></div>
          <div class="color-swatch" data-color="#ff9f1c" style="background:#ff9f1c;"></div>
          <div class="color-swatch" data-color="#00c8ff" style="background:#00c8ff;"></div>
          <div class="color-swatch" data-color="#ff6b6b" style="background:#ff6b6b;"></div>
        </div>
      </div>
      <div class="status loading" id="statusLoading"><div class="spinner"></div><span>Buscando dirección…</span></div>
      <div class="status error" id="statusError"><span>⚠️</span><span id="errorMsg">No encontrado.</span></div>
      <button class="btn-add" id="addBtn">＋ Agregar al mapa</button>
    </div>

    <div class="locations-header">
      <div style="display:flex;align-items:center;">
        <span class="section-title">Ubicaciones activas</span>
        <span class="locations-count" id="locCount">0</span>
      </div>
      <button class="btn-clear-all" id="clearAllBtn">Limpiar todo</button>
    </div>

    <div class="locations-list" id="locationsList">
      <div class="empty-state" id="emptyState">
        <div class="e-icon">🗺️</div>
        <div>Aún no hay ubicaciones.<br>Agrega la primera arriba.</div>
      </div>
    </div>
    <div class="sidebar-footer">OpenStreetMap · Nominatim · Leaflet.js</div>
  </aside>

  <div style="position:relative;">
    <div id="map"></div>
    <button class="btn-fit" id="fitAllBtn">🗺️ Ver todo</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  (function() {
    console.log("Iniciando Radio Explorer...");
    
    // Esperar a que el DOM esté completamente cargado
    window.addEventListener('DOMContentLoaded', function() {
      console.log("DOM cargado, inicializando mapa...");
      
      // Elementos del DOM
      const mapDiv = document.getElementById('map');
      if (!mapDiv) {
        console.error("No se encontró el elemento #map");
        return;
      }
      
      // Inicializar mapa (Leaflet)
      const map = L.map('map').setView([20, 0], 2);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        maxZoom: 19,
      }).addTo(map);
      console.log("Mapa inicializado correctamente");
      
      // Estado
      let locations = [];
      let idCounter = 0;
      let selectedColor = '#00e5a0';
      let debounceTimer = null;
      const COLOR_PALETTE = ['#00e5a0','#0099ff','#ff4d6d','#ffd166','#c77dff','#ff9f1c','#00c8ff','#ff6b6b'];
      
      // Elementos del DOM
      const locationInput = document.getElementById('locationInput');
      const suggestionsBox = document.getElementById('suggestions');
      const radiusInput = document.getElementById('radiusInput');
      const unitSelect = document.getElementById('unitSelect');
      const addBtn = document.getElementById('addBtn');
      const statusLoading = document.getElementById('statusLoading');
      const statusError = document.getElementById('statusError');
      const errorMsgSpan = document.getElementById('errorMsg');
      const locationsContainer = document.getElementById('locationsList');
      const emptyStateDiv = document.getElementById('emptyState');
      const locCountSpan = document.getElementById('locCount');
      const clearAllBtn = document.getElementById('clearAllBtn');
      const fitAllBtn = document.getElementById('fitAllBtn');
      const colorPickerDiv = document.getElementById('colorPicker');
      
      if (!locationInput || !addBtn) {
        console.error("Faltan elementos críticos en el DOM");
        return;
      }
      
      // Utilidades
      function getUniqueId() { return ++idCounter; }
      function toMeters(val, unit) {
        if (unit === 'km') return val * 1000;
        if (unit === 'mi') return val * 1609.344;
        return val;
      }
      function formatRadius(val, unit) { return `${parseFloat(val).toFixed(1)} ${unit}`; }
      function shortName(full) { return full.split(', ').slice(0,2).join(', '); }
      function setStatus(type) {
        statusLoading.style.display = 'none';
        statusError.style.display = 'none';
        if (type === 'loading') statusLoading.style.display = 'flex';
        if (type === 'error') statusError.style.display = 'flex';
      }
      
      function updateGlobalColorPicker(color) {
        colorPickerDiv.querySelectorAll('.color-swatch').forEach(sw => {
          sw.classList.toggle('active', sw.dataset.color === color);
        });
        selectedColor = color;
      }
      
      function preselectNextColor() {
        const used = locations.map(l => l.color);
        const next = COLOR_PALETTE.find(c => !used.includes(c)) || COLOR_PALETTE[locations.length % COLOR_PALETTE.length];
        if (next) {
          selectedColor = next;
          updateGlobalColorPicker(next);
        }
      }
      
      // Dibujar en mapa
      function drawLocation(loc) {
        if (loc.circle) map.removeLayer(loc.circle);
        if (loc.marker) map.removeLayer(loc.marker);
        if (!loc.visible) return;
        
        const radiusM = toMeters(parseFloat(loc.radius), loc.unit);
        loc.circle = L.circle([loc.lat, loc.lng], {
          radius: radiusM,
          color: loc.color,
          fillColor: loc.color,
          fillOpacity: 0.12,
          weight: 2,
          dashArray: '5 5'
        }).addTo(map);
        
        loc.marker = L.circleMarker([loc.lat, loc.lng], {
          radius: 6,
          color: loc.color,
          fillColor: loc.color,
          fillOpacity: 1,
          weight: 2
        }).addTo(map);
        
        loc.marker.bindPopup(`
          <div style="display:flex;align-items:center;gap:8px;">
            <span style="width:10px;height:10px;border-radius:50%;background:${loc.color};"></span>
            <strong>${shortName(loc.name)}</strong>
          </div>
          <div>Radio: ${formatRadius(loc.radius, loc.unit)}</div>
          <div>Área: ${((Math.PI * Math.pow(radiusM/1000, 2)).toFixed(2))} km²</div>
        `);
      }
      
      function removeLayer(loc) {
        if (loc.circle) map.removeLayer(loc.circle);
        if (loc.marker) map.removeLayer(loc.marker);
      }
      
      function fitAll() {
        const visible = locations.filter(l => l.visible && l.circle);
        if (!visible.length) return;
        const bounds = visible.map(l => l.circle.getBounds()).reduce((a,b) => a.extend(b));
        map.fitBounds(bounds, { padding: [50,50] });
      }
      
      // Construcción de tarjetas
      function buildCard(loc) {
        const card = document.createElement('div');
        card.className = 'loc-card';
        card.dataset.id = loc.id;
        card.innerHTML = `
          <div class="loc-card-header">
            <span class="loc-dot"></span>
            <span class="loc-name"></span>
            <span class="loc-badge"></span>
            <div class="loc-actions">
              <button class="loc-btn toggle-btn" title="Mostrar/Ocultar">👁️</button>
              <button class="loc-btn focus-btn" title="Centrar">🎯</button>
              <button class="loc-btn delete" title="Eliminar">✕</button>
            </div>
          </div>
          <div class="loc-body">
            <div class="loc-edit-row">
              <select class="loc-unit-sel"><option value="km">Km</option><option value="mi">Mi</option><option value="m">m</option></select>
              <input type="number" class="loc-radius-inp" min="0.05" step="0.1" />
            </div>
            <div class="loc-color-row"></div>
          </div>
        `;
        
        const colorRow = card.querySelector('.loc-color-row');
        COLOR_PALETTE.forEach(c => {
          const sw = document.createElement('div');
          sw.className = 'loc-swatch';
          sw.style.background = c;
          sw.dataset.color = c;
          sw.addEventListener('click', (e) => {
            e.stopPropagation();
            colorRow.querySelectorAll('.loc-swatch').forEach(s => s.classList.remove('active'));
            sw.classList.add('active');
            loc.color = c;
            drawLocation(loc);
            syncCard(card, loc);
          });
          colorRow.appendChild(sw);
        });
        
        // Eventos
        card.querySelector('.loc-card-header').addEventListener('click', (e) => {
          if (!e.target.closest('.loc-actions')) card.querySelector('.loc-body').classList.toggle('open');
        });
        card.querySelector('.toggle-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          loc.visible = !loc.visible;
          drawLocation(loc);
          syncCard(card, loc);
        });
        card.querySelector('.focus-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          if (loc.circle) map.fitBounds(loc.circle.getBounds(), { padding: [70,70] });
        });
        card.querySelector('.delete').addEventListener('click', (e) => {
          e.stopPropagation();
          removeLayer(loc);
          locations = locations.filter(l => l.id !== loc.id);
          card.remove();
          renderList();
        });
        
        const radiusInp = card.querySelector('.loc-radius-inp');
        const unitSel = card.querySelector('.loc-unit-sel');
        radiusInp.addEventListener('input', () => { loc.radius = parseFloat(radiusInp.value) || 0.5; drawLocation(loc); syncCard(card, loc); });
        unitSel.addEventListener('change', () => { loc.unit = unitSel.value; drawLocation(loc); syncCard(card, loc); });
        
        return card;
      }
      
      function syncCard(card, loc) {
        card.querySelector('.loc-dot').style.background = loc.color;
        card.querySelector('.loc-name').textContent = shortName(loc.name);
        const badge = card.querySelector('.loc-badge');
        badge.textContent = formatRadius(loc.radius, loc.unit);
        badge.style.background = loc.color + '20';
        badge.style.color = loc.color;
        card.querySelector('.loc-unit-sel').value = loc.unit;
        card.querySelector('.loc-radius-inp').value = loc.radius;
        const colorRow = card.querySelector('.loc-color-row');
        colorRow.querySelectorAll('.loc-swatch').forEach(sw => sw.classList.toggle('active', sw.dataset.color === loc.color));
        card.querySelector('.toggle-btn').style.opacity = loc.visible ? '1' : '0.45';
        card.style.opacity = loc.visible ? '1' : '0.6';
      }
      
      function renderList() {
        locCountSpan.textContent = locations.length;
        emptyStateDiv.style.display = locations.length ? 'none' : 'flex';
        locations.forEach(loc => {
          let card = locationsContainer.querySelector(`.loc-card[data-id="${loc.id}"]`);
          if (!card) {
            card = buildCard(loc);
            locationsContainer.insertBefore(card, emptyStateDiv);
          }
          syncCard(card, loc);
        });
        // Eliminar huérfanos
        document.querySelectorAll('.loc-card').forEach(card => {
          if (!locations.find(l => l.id == card.dataset.id)) card.remove();
        });
      }
      
      // Autocompletado
      async function fetchSuggestions(q, callback) {
        try {
          const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=5`, { headers: { 'Accept-Language': 'es' } });
          const data = await res.json();
          callback(data);
        } catch(e) { console.warn(e); callback([]); }
      }
      
      function showSuggestions(results, onSelect) {
        suggestionsBox.innerHTML = '';
        if (!results.length) { suggestionsBox.classList.remove('active'); return; }
        results.forEach(r => {
          const div = document.createElement('div');
          div.className = 'suggestion-item';
          div.innerHTML = `<span>📍</span><div><strong>${r.display_name.split(', ').slice(0,2).join(', ')}</strong></div>`;
          div.addEventListener('click', () => { onSelect(r); suggestionsBox.classList.remove('active'); });
          suggestionsBox.appendChild(div);
        });
        suggestionsBox.classList.add('active');
      }
      
      locationInput.addEventListener('input', () => {
        clearTimeout(debounceTimer);
        const q = locationInput.value.trim();
        if (q.length < 3) { suggestionsBox.classList.remove('active'); return; }
        debounceTimer = setTimeout(() => {
          fetchSuggestions(q, (results) => {
            showSuggestions(results, (selected) => { locationInput.value = selected.display_name; });
          });
        }, 350);
      });
      document.addEventListener('click', (e) => { if (!e.target.closest('.input-wrap')) suggestionsBox.classList.remove('active'); });
      
      // Agregar ubicación
      addBtn.addEventListener('click', async () => {
        const query = locationInput.value.trim();
        if (!query) { errorMsgSpan.textContent = 'Escribe una dirección.'; setStatus('error'); return; }
        setStatus('loading');
        addBtn.disabled = true;
        try {
          const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=1`, { headers: { 'Accept-Language': 'es' } });
          const data = await res.json();
          if (!data.length) throw new Error();
          const newLoc = {
            id: getUniqueId(),
            name: data[0].display_name,
            lat: parseFloat(data[0].lat),
            lng: parseFloat(data[0].lon),
            radius: parseFloat(radiusInput.value) || 1,
            unit: unitSelect.value,
            color: selectedColor,
            visible: true,
            circle: null, marker: null
          };
          locations.push(newLoc);
          drawLocation(newLoc);
          renderList();
          setStatus(null);
          locationInput.value = '';
          preselectNextColor();
          fitAll();
        } catch(e) {
          errorMsgSpan.textContent = 'No se encontró la ubicación.';
          setStatus('error');
        } finally {
          addBtn.disabled = false;
        }
      });
      
      locationInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addBtn.click(); });
      clearAllBtn.addEventListener('click', () => { locations.forEach(l => removeLayer(l)); locations = []; renderList(); });
      fitAllBtn.addEventListener('click', fitAll);
      
      // Inicializar color
      updateGlobalColorPicker('#00e5a0');
      renderList();
      console.log("Radio Explorer listo");
    });
  })();
</script>
</body>
</html>
