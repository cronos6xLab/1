<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de Radios Geográficos</title>
    
    <!-- Fuentes de Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- CSS de Leaflet para el mapa -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-glass: rgba(255, 255, 255, 0.75);
            --border-glass: rgba(255, 255, 255, 0.4);
            --text-main: #1F2937;
            --text-muted: #6B7280;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #f3f4f6;
        }

        /* Contenedor del Mapa */
        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Panel Flotante Estilo 2026 (Glassmorphism) */
        .ui-panel {
            position: absolute;
            top: 24px;
            left: 24px;
            z-index: 1000;
            width: 380px;
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-height: calc(100vh - 48px);
        }

        .header h1 {
            font-size: 1.25rem;
            color: var(--text-main);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Formulario y Controles */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.9);
            font-size: 0.95rem;
            color: var(--text-main);
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
        }

        .row {
            display: flex;
            gap: 12px;
        }

        .row input {
            flex: 1;
        }

        .row select {
            padding: 14px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.9);
            font-size: 0.95rem;
            outline: none;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
            box-shadow: 0 8px 16px rgba(79, 70, 229, 0.25);
        }

        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        button:disabled {
            background-color: #9CA3AF;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* Lista de ubicaciones agregadas */
        .locations-list {
            list-style: none;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 4px;
        }

        /* Scrollbar estilizado */
        .locations-list::-webkit-scrollbar {
            width: 6px;
        }
        .locations-list::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
        }

        .location-item {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }

        .location-item:hover {
            background: rgba(255, 255, 255, 0.9);
        }

        .location-info h4 {
            font-size: 0.9rem;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 220px;
        }

        .location-info p {
            font-size: 0.75rem;
            color: var(--primary);
            font-weight: 600;
            margin-top: 2px;
        }

        .btn-remove {
            background: transparent;
            color: #EF4444;
            box-shadow: none;
            padding: 8px;
            border-radius: 50%;
        }

        .btn-remove:hover {
            background: rgba(239, 68, 68, 0.1);
            color: #DC2626;
        }

        /* Adaptabilidad en móviles */
        @media (max-width: 768px) {
            .ui-panel {
                top: auto;
                bottom: 0;
                left: 0;
                width: 100%;
                border-radius: 24px 24px 0 0;
                max-height: 50vh;
                padding: 20px;
            }
            .leaflet-control-zoom {
                display: none; /* Ocultar controles de zoom en móvil para diseño más limpio */
            }
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="ui-panel">
        <div class="header">
            <h1>Explorador Espacial</h1>
            <p>Añade ubicaciones y visualiza sus radios</p>
        </div>

        <form id="locationForm" class="input-group">
            <input type="text" id="addressInput" placeholder="Ej. Reforma, CDMX o Paseo de la Castellana" required>
            
            <div class="row">
                <input type="number" id="radiusInput" placeholder="Distancia" min="0.1" step="0.1" required>
                <select id="unitSelect">
                    <option value="km">Kilómetros</option>
                    <option value="m">Metros</option>
                </select>
            </div>
            
            <button type="submit" id="submitBtn">Añadir al mapa</button>
        </form>

        <ul class="locations-list" id="locationsList">
            <!-- Los items generados irán aquí -->
        </ul>
    </div>

    <!-- Script de Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. Inicializar el Mapa (Centrado globalmente de forma neutral al inicio)
        const map = L.map('map', {
            zoomControl: false // Lo ocultamos para ponerlo en un lugar mejor
        }).setView([19.4326, -99.1332], 5); // Por defecto CDMX

        // Añadir controles de zoom en la esquina superior derecha
        L.control.zoom({ position: 'topright' }).addTo(map);

        // Capa base de OpenStreetMap (Gratuita, no requiere token)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        // Estructura para almacenar las ubicaciones activas
        let activeLocations = [];

        // Elementos del DOM
        const form = document.getElementById('locationForm');
        const addressInput = document.getElementById('addressInput');
        const radiusInput = document.getElementById('radiusInput');
        const unitSelect = document.getElementById('unitSelect');
        const submitBtn = document.getElementById('submitBtn');
        const locationsList = document.getElementById('locationsList');

        // Función principal al enviar el formulario
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const address = addressInput.value.trim();
            const radiusValue = parseFloat(radiusInput.value);
            const unit = unitSelect.value;
            
            if (!address || isNaN(radiusValue)) return;

            // Bloquear botón mientras busca
            submitBtn.disabled = true;
            submitBtn.textContent = 'Buscando...';

            try {
                // Usamos la API de Nominatim de OpenStreetMap para geocodificar (es gratis)
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}&limit=1`);
                const data = await response.json();

                if (data.length === 0) {
                    alert('No se encontró la dirección. Intenta ser más específico.');
                    return;
                }

                const lat = parseFloat(data[0].lat);
                const lon = parseFloat(data[0].lon);
                const displayName = data[0].display_name.split(',')[0]; // Tomar la primera parte del nombre para la UI

                // Calcular radio en metros (Leaflet usa metros para los círculos)
                const radiusInMeters = unit === 'km' ? radiusValue * 1000 : radiusValue;

                // Crear Marcador
                const marker = L.marker([lat, lon]).addTo(map);
                
                // Crear Círculo con un diseño moderno
                const circle = L.circle([lat, lon], {
                    color: '#4F46E5',
                    fillColor: '#4F46E5',
                    fillOpacity: 0.15,
                    weight: 2,
                    radius: radiusInMeters
                }).addTo(map);

                // Guardar en el arreglo de ubicaciones
                const id = Date.now().toString();
                activeLocations.push({
                    id,
                    lat,
                    lon,
                    marker,
                    circle,
                    name: displayName,
                    radiusDesc: `${radiusValue} ${unit}`
                });

                // Actualizar la lista en la UI y centrar el mapa
                renderLocationsList();
                fitMapToBounds();
                
                // Limpiar formulario
                addressInput.value = '';
                addressInput.focus();

            } catch (error) {
                console.error('Error en la búsqueda:', error);
                alert('Ocurrió un error al buscar la ubicación. Intenta de nuevo.');
            } finally {
                // Restaurar botón
                submitBtn.disabled = false;
                submitBtn.textContent = 'Añadir al mapa';
            }
        });

        // Renderizar la lista de la barra lateral
        function renderLocationsList() {
            locationsList.innerHTML = '';
            
            activeLocations.forEach(loc => {
                const li = document.createElement('li');
                li.className = 'location-item';
                
                li.innerHTML = `
                    <div class="location-info">
                        <h4>${loc.name}</h4>
                        <p>Radio: ${loc.radiusDesc}</p>
                    </div>
                    <button class="btn-remove" onclick="removeLocation('${loc.id}')" title="Eliminar">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                `;
                
                locationsList.appendChild(li);
            });
        }

        // Eliminar una ubicación específica
        window.removeLocation = function(id) {
            const index = activeLocations.findIndex(loc => loc.id === id);
            if (index !== -1) {
                // Quitar del mapa
                map.removeLayer(activeLocations[index].marker);
                map.removeLayer(activeLocations[index].circle);
                
                // Quitar del arreglo
                activeLocations.splice(index, 1);
                
                // Actualizar vista
                renderLocationsList();
                fitMapToBounds();
            }
        }

        // Ajustar la cámara del mapa para que se vean todos los círculos
        function fitMapToBounds() {
            if (activeLocations.length === 0) return;
            
            // Agrupar todos los círculos en una capa (FeatureGroup) para calcular el encuadre (Bounds)
            const group = new L.featureGroup(activeLocations.map(loc => loc.circle));
            map.fitBounds(group.getBounds(), { padding: [50, 50] });
        }
    </script>
</body>
</html>
